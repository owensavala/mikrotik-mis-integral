<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin • Panel Kontrol MikroTik MIS Integral</title>
    <link rel="icon" type="image/png" href="/static/img/logo.png">
    <style>
        :root {
            --primary: #0f565e;
            --primary-dark: #083338;
            --primary-light: #16727c;
            --accent: #e5a924;
            --accent-hover: #c99017;
            --bg-body: #0d282c;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #071c1e 0%, #0f565e 50%, #0a3338 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle background Islamic geometric pattern */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(229, 169, 36, 0.08) 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 2;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 36px 32px;
            backdrop-filter: blur(12px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-logo {
            width: 76px;
            height: 76px;
            object-fit: contain;
            margin: 0 auto 14px;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
        }

        .login-header h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.3px;
        }

        .login-header p {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 500;
        }

        .badge-secure {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #ecfdf5;
            color: #065f46;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 12px;
            margin-top: 10px;
            border: 1px solid #a7f3d0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 11px 14px;
            padding-right: 42px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: #1e293b;
            background: #f8fafc;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 3.5px rgba(15, 86, 94, 0.15);
        }

        .toggle-pwd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-pwd:hover {
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: #ffffff;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            box-shadow: 0 4px 12px rgba(15, 86, 94, 0.3);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            box-shadow: 0 6px 16px rgba(15, 86, 94, 0.4);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .alert-error {
            display: none;
            background: var(--danger-bg);
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 12.5px;
            margin-bottom: 18px;
            font-weight: 500;
            line-height: 1.4;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11.5px;
            color: #cbd5e1;
            opacity: 0.85;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card" id="loginCard">
            <div class="login-header">
                <img src="/static/img/logo.png" alt="MIS Integral Ternate" class="login-logo" onerror="this.style.display='none'">
                <h1>PANEL KONTROL MIKROTIK</h1>
                <p>MIS Integral • Kampus Tauhid Ternate</p>
                <div class="badge-secure">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    Akses Khusus Administrator Jaringan
                </div>
            </div>

            <div id="errorAlert" class="alert-error">
                Username atau password admin salah!
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username Admin</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" placeholder="Masukkan username admin..." required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Masukkan password..." required autocomplete="current-password">
                        <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="Tampilkan Password">
                            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    <span>Masuk ke Dashboard</span>
                </button>
            </form>
        </div>

        <div class="login-footer">
            &copy; 2026 MIS Integral Ternate • Sistem Terproteksi HttpOnly Session
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const errAlert = document.getElementById('errorAlert');
            const card = document.getElementById('loginCard');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) return;

            btn.disabled = true;
            btn.querySelector('span').innerText = 'Memverifikasi...';
            errAlert.style.display = 'none';
            card.classList.remove('shake');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    btn.querySelector('span').innerText = 'Berhasil! Membuka...';
                    window.location.href = '/';
                } else {
                    card.classList.add('shake');
                    errAlert.innerText = data.error || 'Username atau password admin salah!';
                    errAlert.style.display = 'block';
                    btn.disabled = false;
                    btn.querySelector('span').innerText = 'Masuk ke Dashboard';
                }
            } catch (err) {
                card.classList.add('shake');
                errAlert.innerText = 'Terjadi kesalahan jaringan. Silakan coba lagi.';
                errAlert.style.display = 'block';
                btn.disabled = false;
                btn.querySelector('span').innerText = 'Masuk ke Dashboard';
            }
        }
    </script>
</body>
</html>
